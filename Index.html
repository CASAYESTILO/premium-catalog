<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Cloud con Supabase</title>
    <!-- Cargamos la librería oficial de Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #25D366; --dark: #1e1e24; --light: #f4f4f9; --card-bg: #ffffff; --text: #333333; --accent: #0076ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: var(--light); color: var(--text); padding-bottom: 4rem; }
        header { background: var(--dark); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1rem; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.95rem; gap: 0.5rem; width: 100%; margin-bottom: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-danger { background: #ff3b30; color: white; }
        .btn-download { background: var(--accent); color: white; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1rem; }
        .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e5e5ea; display: flex; flex-direction: column; }
        .card .img-container { width: 100%; height: 280px; background: #e5e5ea; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .card-title { font-size: 1.25rem; font-weight: 700; color: var(--dark); }
        .card-price { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .admin-panel { background: #ffffff; border-radius: 16px; padding: 1.5rem; margin-top: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: none; border: 1px solid #d1d1d6; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #48484a; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #c7c7cc; border-radius: 10px; font-size: 1rem; background: #fafafa; outline: none; }
        .admin-product-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid #e5e5ea; }
        @media(min-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Catálogo Supabase</div>
        <button class="btn btn-dark" style="width: auto; margin: 0; padding: 0.5rem 1rem;" onclick="toggleAdmin()">Panel Admin</button>
    </header>

    <div class="container">
        <!-- Panel Admin -->
        <div id="panelAdmin" class="admin-panel">
            <h2>⚙️ Consola de Configuración</h2>
            <div class="form-group">
                <label for="cfgWhatsapp">Número de WhatsApp Base:</label>
                <input type="number" id="cfgWhatsapp">
            </div>
            <button class="btn btn-dark" onclick="guardarWhatsapp()">Guardar WhatsApp</button>
            
            <h3>🔐 Cambiar Credenciales de Acceso</h3>
            <div class="form-group">
                <label for="nuevoUsuario">Nuevo Usuario:</label>
                <input type="text" id="nuevoUsuario">
            </div>
            <div class="form-group">
                <label for="nuevaClave">Nueva Contraseña:</label>
                <input type="password" id="nuevaClave" placeholder="Mínimo 4 caracteres">
            </div>
            <button class="btn btn-dark" onclick="cambiarCredenciales()">Actualizar Seguridad</button>

            <h3>📦 Publicar Nuevo Artículo</h3>
            <div class="form-group">
                <label for="pNombre">Nombre del Producto:</label>
                <input type="text" id="pNombre">
            </div>
            <div class="form-group">
                <label for="pPrecio">Precio ($):</label>
                <input type="number" id="pPrecio">
            </div>
            <div class="form-group">
                <label for="pFoto">Fotografía (Cámara o Galería):</label>
                <input type="file" id="pFoto" accept="image/*">
            </div>
            <button class="btn btn-primary" id="btnSubir" onclick="agregarProducto()">Subir y Guardar</button>

            <h3>🗑️ Inventario Activo</h3>
            <div id="listaAdminProductos"></div>
        </div>

        <div id="catalogo" class="grid"></div>
    </div>

    <script>

        const _supabase = supabase.createClient(https://kpnjdtvimswagbbdcrqu.supabase.co);

        let configLocal = { whatsapp: "573004090852", usuario: "admin", clave: "1234" };
        let isAdminAutenticado = false;

        async function init() {
            // Leer configuración desde base de datos relacional
            const { data } = await _supabase.from('tienda_config').select('*').eq('id', 1).single();
            if(data) configLocal = data;
            await cargarCatalogo();
        }

        async function cargarCatalogo() {
            const { data: productos } = await _supabase.from('tienda_productos').select('*').order('id', { ascending: false });
            const container = document.getElementById('catalogo');
            container.innerHTML = (!productos || productos.length === 0) ? `<p style="text-align:center; padding:3rem; color:#8e8e93; width:100%;">No hay productos activos.</p>` : "";

            if(productos) {
                productos.forEach(p => {
                    const msj = encodeURIComponent(`¡Hola! Me interesa:\n*Artículo:* ${p.nombre}\n*Precio:* $${p.precio}\n*Imagen:* ${p.foto}`);
                    container.innerHTML += `
                        <div class="card">
                            <div class="img-container"><img src="${p.foto}" loading="lazy"></div>
                            <div class="card-body">
                                <div class="card-title">${p.nombre}</div>
                                <div class="card-price">$${Number(p.precio).toLocaleString()}</div>
                                <a class="btn btn-primary" href="https://wa.me{configLocal.whatsapp}?text=${msj}" target="_blank">💬 Pedir por WhatsApp</a>
                                <button class="btn btn-download" onclick="descargarImagen('${p.foto}', '${p.nombre}')">📥 Descargar Foto</button>
                            </div>
                        </div>`;
                });
            }
        }

        async function toggleAdmin() {
            const panel = document.getElementById('panelAdmin');
            if (!isAdminAutenticado) {
                const userIn = prompt("Usuario:");
                const passIn = prompt("Contraseña:");
                if (userIn && passIn && userIn.trim() === configLocal.usuario && passIn.trim() === configLocal.clave) {
                    isAdminAutenticado = true;
                    panel.style.display = "block";
                    document.getElementById('cfgWhatsapp').value = configLocal.whatsapp;
                    document.getElementById('nuevoUsuario').value = configLocal.usuario;
                    renderizarListaAdmin();
                } else if(userIn !== null) { alert("❌ Credenciales incorrectas."); }
            } else {
                panel.style.display = panel.style.display === "none" ? "block" : "none";
            }
        }

        async function guardarWhatsapp() {
            const num = document.getElementById('cfgWhatsapp').value.trim();
            if(!num) return alert("Número inválido");
            await _supabase.from('tienda_config').update({ whatsapp: num }).eq('id', 1);
            configLocal.whatsapp = num;
            alert("✅ WhatsApp guardado en la nube.");
            await cargarCatalogo();
        }

        async function cambiarCredenciales() {
            const user = document.getElementById('nuevoUsuario').value.trim();
            const nueva = document.getElementById('nuevaClave').value.trim();
            if(!user) return alert("Usuario vacío");
            
            let updateData = { usuario: user };
            if(nueva && nueva.length >= 4) updateData.clave = nueva;

            await _supabase.from('tienda_config').update(updateData).eq('id', 1);
            configLocal.usuario = user;
            if(nueva && nueva.length >= 4) configLocal.clave = nueva;
            
            document.getElementById('nuevaClave').value = "";
            alert("🔒 Credenciales actualizadas en Supabase.");
        }
